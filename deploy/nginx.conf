# /etc/nginx/sites-available/kassa  — then: ln -s ../sites-available/kassa /etc/nginx/sites-enabled/ && nginx -s reload
# HTTPS: certbot --nginx -d kassa.example.uz
server {
  listen 80;
  server_name kassa.example.uz;
  client_max_body_size 20m;   # contract / guarantee letter uploads (app limit 15 MB)

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;

  # Hashed build assets never change: let browsers keep them for a year.
  location /_nuxt/ {
    proxy_pass http://127.0.0.1:3000;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
