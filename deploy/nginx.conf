# /etc/nginx/sites-available/kassa  — then: ln -s ../sites-available/kassa /etc/nginx/sites-enabled/ && nginx -s reload
# HTTPS: certbot --nginx -d kassa.example.uz
server {
  listen 80;
  server_name kassa.example.uz;
  client_max_body_size 20m;   # contract / guarantee letter uploads (app limit 15 MB)

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
