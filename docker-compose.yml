name: ${COMPOSE_PROJECT_NAME:-shifoxona}

x-backend-env: &backend-env
  NODE_ENV: ${NODE_ENV:-development}
  TZ: ${TIMEZONE:-Asia/Tashkent}
  TIMEZONE: ${TIMEZONE:-Asia/Tashkent}
  APP_PORT: ${APP_PORT:-4000}
  APP_URL: ${APP_URL:-http://localhost:4000}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  BODY_LIMIT: ${BODY_LIMIT:-5mb}
  THROTTLE_TTL_SECONDS: ${THROTTLE_TTL_SECONDS:-60}
  THROTTLE_LIMIT: ${THROTTLE_LIMIT:-300}
  LOGIN_THROTTLE_LIMIT: ${LOGIN_THROTTLE_LIMIT:-10}
  RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
  RUN_SEED: ${RUN_SEED:-true}
  DATABASE_HOST: postgres
  DATABASE_PORT: 5432
  DATABASE_NAME: ${DATABASE_NAME:-shifoxona}
  DATABASE_USER: ${DATABASE_USER:-shifoxona}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
  DATABASE_SSL: ${DATABASE_SSL:-false}
  DATABASE_LOGGING: ${DATABASE_LOGGING:-false}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  SEED_ADMIN_LOGIN: ${SEED_ADMIN_LOGIN:-admin01}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin01}
  SEED_KIOSK_LOGIN: ${SEED_KIOSK_LOGIN:-panel01}
  SEED_KIOSK_PASSWORD: ${SEED_KIOSK_PASSWORD:-panel01}
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-shifoxona}
      POSTGRES_USER: ${DATABASE_USER:-shifoxona}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      TZ: ${TIMEZONE:-Asia/Tashkent}
      PGTZ: ${TIMEZONE:-Asia/Tashkent}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:4000/api/v1}
      NUXT_PUBLIC_WS_URL: ${NUXT_PUBLIC_WS_URL:-http://localhost:4000}
      NUXT_PUBLIC_DEFAULT_LOCALE: ${NUXT_PUBLIC_DEFAULT_LOCALE:-uz}
      PORT: 3000
      HOST: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:
  redisdata:
