# Usage: cp .env.example .env (fill secrets), then: docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kassa
      POSTGRES_USER: kassa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kassa -d kassa"]
      interval: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kassa:${POSTGRES_PASSWORD}@db:5432/kassa
      DIRECT_URL: postgresql://kassa:${POSTGRES_PASSWORD}@db:5432/kassa
      NUXT_SESSION_SECRET: ${NUXT_SESSION_SECRET:?set NUXT_SESSION_SECRET in .env}
      BOOTSTRAP_ADMIN_TOKEN: ${BOOTSTRAP_ADMIN_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_TZ_OFFSET_MINUTES: ${APP_TZ_OFFSET_MINUTES:-300}
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  pgdata:
